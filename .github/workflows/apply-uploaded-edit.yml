name: Apply uploaded site edit

on:
  push:
    paths:
      - "edits-update-*.json"

permissions:
  contents: write

concurrency:
  group: site-edit-upload
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply latest uploaded payload
        run: node .github/scripts/apply-uploaded-edit.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
